# WirePlumber 0.5 example: native PipeWire HFP (1.3.82+ / 1.4).
# Install as a drop-in under your WirePlumber config, e.g.:
#   ~/.config/wireplumber/wireplumber.conf.d/50-sim-phone-hfp_hf.conf
# Adjust device.name match if you scope to one adapter.

monitor.bluez.properties = {
  bluez5.hfphsp-backend = "native"
  bluez5.headset-roles = [ hfp_hf ]
}
